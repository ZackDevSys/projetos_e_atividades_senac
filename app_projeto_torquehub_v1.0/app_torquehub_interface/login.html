<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorqueHub - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-login">
    <main class="login-container">
        <section class="login-card">
            <div class="logo-login">
                <img src="img/logo_torquehub_ofc_retro.png" alt="TorqueHub - Gestão de Oficina">
            </div>

            <div class="login-titulo">
                <span>ACESSO AO SISTEMA</span>
                <p>Informe suas credenciais para acessar o TorqueHub.</p>
            </div>

            <form id="formulario-login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password" required>
                </div>

                <button type="submit" class="botao-login">
                    <span>Entrar no sistema</span>
                </button>

                <div id="mensagem-login" class="mensagem-login"></div>
            </form>

            <div class="login-rodape">
                <span>TORQUEHUB</span>
                <span>•</span>
                <span>Gestão de Oficina</span>
            </div>
        </section>
    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
