<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TorqueHub - Login</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="pagina-login">

    <main class="login-container">

        <section class="login-card">

            <div class="logo">

                <h1>Torque<span>Hub</span></h1>

                <p>
                    Sistema de Gestão para Oficina
                </p>

            </div>

            <form id="formulario-login">

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input type="email" id="email" placeholder="Digite seu e-mail" autocomplete="email">

                </div>

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input type="password" id="senha" placeholder="Digite sua senha" autocomplete="current-password">

                </div>

                <button type="submit" class="botao-login">
                    Entrar
                </button>

                <div id="mensagem-login"></div>

            </form>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>

</body>

</html>
